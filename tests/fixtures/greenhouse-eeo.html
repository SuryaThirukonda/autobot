<!doctype html>
<html><head><meta charset="utf-8"><title>Fixture: Greenhouse job-boards EEO and demographic questions (react-select)</title>
<style>
  body{font:14px system-ui;margin:24px;max-width:720px} .label{display:block;font-weight:600;margin:14px 0 4px} .input{width:100%;padding:6px;box-sizing:border-box}
  .select-shell{position:relative} .select__control{display:flex;border:1px solid #ccc;min-height:34px;align-items:center} .select__value-container{flex:1;display:grid;padding:2px 8px}
  .select__placeholder,.select__single-value,.select__input-container{grid-area:1/1} .select__placeholder{color:#888} .select__input{border:0;outline:0;width:100%;font:inherit;padding:0}
  .remix-css-1a0ro4n-requiredInput{opacity:0;pointer-events:none;position:absolute;bottom:0;left:0;right:0;width:100%}
  .select__menu{position:absolute;left:0;right:0;z-index:5;background:#fff;border:1px solid #ccc} .select__menu-list{max-height:240px;overflow:auto}
  .select__option{padding:6px;cursor:pointer} .select__option--is-focused{background:#eef} .select__menu-notice{padding:6px;color:#666}
</style></head>
<body>
<h1>Strategic Finance &amp; Analytics Intern</h1>
<!-- Greenhouse-hosted job-boards forms (markup and option lists read 2026-10-19), chosen with ?form=:
     robinhood  job-boards.greenhouse.io/robinhood/jobs/8198241: no EEOC block, only Greenhouse's demographic survey
                (div#demographic-section, numeric question ids). "What is your gender identity?" comes first; a label
                path for "gender" landed on it, typed "Man" and committed "Cisgender woman".
     airbnb     the embed of airbnb/8285171: no EEOC block; Gender/Race/Veteran Status are the company's own questions
                (question_N). The same path typed "Man" into "Gender:" (Male / Female / ...), chose nothing, and the
                status said filled.
     both       (default) as on discord/8806482002: a demographic survey with its own Gender questions, then the EEOC
                block (div.eeoc__container, input#gender / #hispanic_ethnicity / #veteran_status; #race appears in the
                Hispanic question's wrapper once it is answered "No").
     Every question is a react-select 5 control (as in greenhouse-jobboards.html): role=combobox on the <input>, the
     choice shown as select__single-value beside it, a required input while a required question is empty, typing
     filters by substring, "No options" when nothing contains the text. The phone Country select (robinhood, airbnb)
     lists "United States +1" and then shows only the flag and "+1". -->
<form id="application-form" class="application--form" onsubmit="window.__submits++; return false">
  <div class="text-input-wrapper"><div class="input-wrapper"><label id="first_name-label" for="first_name" class="label">First Name<span aria-hidden="true">*</span></label><input id="first_name" class="input input__single-line" aria-label="First Name" aria-required="true" type="text" value=""></div></div>
  <div class="text-input-wrapper"><div class="input-wrapper"><label id="last_name-label" for="last_name" class="label">Last Name<span aria-hidden="true">*</span></label><input id="last_name" class="input input__single-line" aria-label="Last Name" aria-required="true" type="text" value=""></div></div>
  <div class="text-input-wrapper"><div class="input-wrapper"><label id="email-label" for="email" class="label">Email<span aria-hidden="true">*</span></label><input id="email" class="input input__single-line" aria-label="Email" aria-required="true" type="text" value=""></div></div>
  <div id="questions"></div>
  <button type="submit" class="btn btn--pill">Submit application</button>
</form>
<script>
(() => {
  window.__submits = 0;
  window.__picks = {};
  const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");
  const OPTIONS = {
    // Robinhood's demographic survey (boards-api demographic_questions)
    "1255": ["Cisgender woman", "Cisgender man", "Transgender woman", "Transgender man", "Non-binary", "Two-spirit", "My gender identity is not listed", "I don't wish to answer"],
    "1258": ["American Indian or Alaskan Native", "Black or African American", "East Asian", "Hispanic or Latino", "Middle Eastern or North African", "Native Hawaiian or Other Pacific Islander", "South Asian", "Southeast Asian", "White", "Two or More Races", "I don't wish to answer"],
    "1259": ["I am on active duty", "I am part of the national guard or on reserve", "I have never served in the military", "I identify as a protected veteran", "I identify as a non-protected veteran", "I identify in multiple military status categories", "I don't wish to answer"],
    "1261": ["Yes, I have a disability", "No, I don't have a disability", "I don't wish to answer"],
    "1465": ["Yes", "No", "Questioning", "I don't wish to answer"],
    // Airbnb's own questions
    question_69899960: ["Male", "Female", "Other", "Decline To Self Identify"],
    question_69899961: ["American Indian or Alaskan Native", "Asian", "Black or African American", "Hispanic or Latino", "White", "Native Hawaiian or Other Pacific Islander", "Two or More Races", "Decline to Self Identify"],
    question_69899962: ["I am a protected veteran", "I am not a protected veteran", "Decline to Self Identify"],
    // Discord's demographic survey
    "4033064002": ["Male", "Female", "I don't wish to answer"],
    "4033068002": ["Man", "Woman", "Non-binary or third gender", "Genderqueer", "I don't wish to answer"],
    // EEOC (boards-api compliance)
    gender: ["Male", "Female", "Decline To Self Identify"],
    hispanic_ethnicity: ["Yes", "No", "Decline To Self Identify"],
    race: ["American Indian or Alaskan Native", "Asian", "Black or African American", "Hispanic or Latino", "White", "Native Hawaiian or Other Pacific Islander", "Two or More Races", "Decline To Self Identify"],
    veteran_status: ["I am not a protected veteran", "I identify as one or more of the classifications of a protected veteran", "I don't wish to answer"],
    country: ["Canada +1", "India +91", "United Kingdom +44", "United States +1"],
  };
  // How a choice shows in select__single-value (default: the option label).
  const DISPLAY = { country: (t) => `<div class="iti__flag"></div><span>${esc(t.split(" ").pop())}</span>` };
  const slot = (id, label, required) => `<div class="rs" data-id="${esc(id)}" data-label="${esc(label)}" data-required="${required}"></div>`;
  const checkbox = (id, name, value, text) => `<div class="checkbox__wrapper"><div class="checkbox__input"><input type="checkbox" id="${esc(id)}" name="${esc(name)}" value="${esc(value)}"></div><label for="${esc(id)}" class="checkbox__label">${esc(text)}</label></div>`;
  const PHONE = `<fieldset class="phone-input"><legend class="label">Phone</legend>${slot("country", "Country", true)}
      <div class="text-input-wrapper"><div class="input-wrapper"><label id="phone-label" for="phone" class="label">Phone<span aria-hidden="true">*</span></label><input id="phone" class="input input__single-line" aria-label="Phone" aria-required="true" type="tel" value=""></div></div></fieldset>`;
  const FORMS = {
    robinhood: `${PHONE}<div id="demographic-section" class="demographic--container"><h3 class="section-header font-primary">Equal Employment Opportunity Information</h3>
        <div class="demographic--description"><p>We encourage applicants to voluntarily identify demographic information.</p></div>
        ${slot("1255", "What is your gender identity?", true)}${slot("1258", "What is your race or ethnicity?", true)}${slot("1259", "What is your military status?", true)}
        ${slot("1261", "What is your disability status?", true)}${slot("1465", "Do you identify as part of the LGBTQ+ community?", false)}</div>
      <div id="gdpr_demographic_data_consent_given" class="checkbox--full-width checkbox">${checkbox("gdpr_demographic_data_consent_given_1", "gdpr_demographic_data_consent_given", "1", "By checking this box, I consent to Robinhood collecting, storing, and processing my responses to the demographic data surveys above.")}</div>`,
    airbnb: `${PHONE}<div class="application--questions">
        <div class="field-wrapper"><fieldset id="question_69899959[]" class="checkbox"><legend class="label">U.S. Equal Opportunity Employment Information (Completion is voluntary)</legend>${checkbox("question_69899959[]_756272071", "question_69899959[]", "756272071", "I decline to answer the following questions.")}</fieldset></div>
        <div class="field-wrapper">${slot("question_69899960", "Gender:", false)}</div>
        <div class="field-wrapper">${slot("question_69899961", "Race:", false)}</div>
        <div class="field-wrapper">${slot("question_69899962", "Veteran Status:", false)}</div></div>`,
    both: `<div id="demographic-section" class="demographic--container"><h3 class="section-header font-primary">Voluntary Self Identification</h3>
        ${slot("4033064002", "Gender", true)}${slot("4033068002", "Gender Identity (optional)", false)}</div>
      <div class="eeoc__container body"><div class="divider" role="separator"></div><div><h2 class="section-header font-primary">Voluntary Self-Identification</h2><p>For government reporting purposes, we ask candidates to respond to the below self-identification survey.</p></div>
        <div class="eeoc__question__wrapper">${slot("gender", "Gender", true)}</div>
        <div class="eeoc__question__wrapper">${slot("hispanic_ethnicity", "Are you Hispanic/Latino?", true)}<a href="#definitions">Race &amp; Ethnicity Definitions</a></div>
        <div class="eeoc__question__wrapper">${slot("veteran_status", "Veteran Status", true)}</div></div>`,
  };
  const form = new URLSearchParams(location.search).get("form") || "both";
  document.getElementById("questions").innerHTML = FORMS[form];

  // The markup react-select renders for a closed, empty control (a required one also gets the hidden required input).
  const expand = (slotEl) => {
    const { id, label } = slotEl.dataset, required = slotEl.dataset.required === "true";
    slotEl.outerHTML = `<div class="select"><div class="select__container"><label id="${esc(id)}-label" for="${esc(id)}" class="label select__label">${esc(label)}${required ? '<span aria-hidden="true">*</span>' : ""}</label>
      <div class="select-shell remix-css-b62m3t-container"><span id="react-select-${esc(id)}-live-region" class="remix-css-7pg0cj-a11yText"></span><span aria-live="polite" aria-atomic="false" aria-relevant="additions text" role="log" class="remix-css-7pg0cj-a11yText"></span>
        <div><div class="select__control remix-css-13cymwt-control"><div class="select__value-container remix-css-hlgwow"><div class="select__placeholder remix-css-1jqq78o-placeholder" id="react-select-${esc(id)}-placeholder">Select...</div>
          <div class="select__input-container remix-css-19bb58m" data-value=""><input class="select__input" autocapitalize="none" autocomplete="off" autocorrect="off" id="${esc(id)}" spellcheck="false" tabindex="0" type="text" aria-autocomplete="list" aria-expanded="false" aria-haspopup="true" aria-errormessage="${esc(id)}-error" aria-invalid="false" aria-labelledby="${esc(id)}-label" aria-required="${required}" role="combobox" aria-activedescendant="" aria-describedby="react-select-${esc(id)}-placeholder ${esc(id)}-error" enterkeyhint="done" value=""></div></div>
          <div class="select__indicators remix-css-1wy0on6"><button type="button" class="icon-button icon-button--sm" aria-label="Toggle flyout" tabindex="-1">&#9662;</button></div></div></div>
        ${required ? '<input required="" tabindex="-1" aria-hidden="true" class="remix-css-1a0ro4n-requiredInput" value="">' : ""}</div></div></div>`;
    rs(id, OPTIONS[id]);
  };

  // react-select behaviour the engine relies on: the control opens the menu, typing filters it by substring ("No
  // options" when nothing contains the text), Enter picks the focused option, a click picks that option, Escape clears
  // the typed text and closes the menu, blur clears it too. A pick shows the label as select__single-value, empties the
  // input and drops the required input. Answering the Hispanic question "No" adds the race question to its wrapper.
  const rs = (id, items) => {
    const input = document.getElementById(id), shell = input.closest(".select-shell"), control = shell.querySelector(".select__control"), box = control.querySelector(".select__value-container");
    const listId = `react-select-${id}-listbox`;
    let menu = null, shown = [];
    const close = () => { if (menu) menu.remove(); menu = null; input.setAttribute("aria-expanded", "false"); input.removeAttribute("aria-controls"); };
    const draw = (html) => {
      if (!menu) {
        menu = document.createElement("div");
        menu.className = "select__menu remix-css-1oc7h4y-menu";
        menu.addEventListener("mousedown", (e) => e.preventDefault());
        menu.addEventListener("click", (e) => { const o = e.target.closest("[role=option]"); if (o) pick(o.textContent); });
        shell.appendChild(menu);
      }
      menu.innerHTML = html;
      input.setAttribute("aria-expanded", "true"); input.setAttribute("aria-controls", listId);
    };
    const render = () => {
      const q = input.value;
      shown = items.filter((t) => t.toLowerCase().includes(q.toLowerCase()));
      const chosen = box.querySelector(".select__single-value")?.textContent;
      draw(shown.length ? `<div class="select__menu-list remix-css-qr46ko" role="listbox" aria-multiselectable="false" id="${listId}">${shown.map((t, i) => `<div class="select__option${i === 0 ? " select__option--is-focused" : ""} remix-css-1yzbtda-option" aria-disabled="false" id="react-select-${id}-option-${i}" tabindex="-1" role="option" aria-selected="${t === chosen}">${esc(t)}</div>`).join("")}</div>`
        : `<div class="select__menu-notice select__menu-notice--no-options remix-css-1wlit7h-NoOptionsMessage">No options</div>`);
    };
    const pick = (t) => {
      (window.__picks[id] ||= []).push(t);
      box.querySelector(".select__placeholder, .select__single-value")?.remove();
      const sv = document.createElement("div");
      sv.className = "select__single-value remix-css-1dimb5e-singleValue"; sv.innerHTML = DISPLAY[id] ? DISPLAY[id](t) : esc(t);
      box.insertBefore(sv, box.querySelector(".select__input-container"));
      shell.querySelector(".remix-css-1a0ro4n-requiredInput")?.remove();
      input.value = "";
      close();
      if (id === "hispanic_ethnicity" && t === "No" && !document.getElementById("race")) {
        const wrapper = input.closest(".eeoc__question__wrapper");
        wrapper.insertAdjacentHTML("beforeend", slot("race", "Please identify your race", true));
        expand(wrapper.querySelector(".rs"));
      }
    };
    control.addEventListener("mousedown", (e) => { if (e.target !== input) e.preventDefault(); input.focus(); if (!menu) render(); });
    input.addEventListener("input", render);
    input.addEventListener("keydown", (e) => {
      if (e.key === "ArrowDown" && !menu) render();
      else if (e.key === "Enter" && menu && shown.length) { e.preventDefault(); pick(shown[0]); }
      else if (e.key === "Escape") { input.value = ""; close(); }
    });
    input.addEventListener("blur", () => { input.value = ""; close(); });
  };
  for (const s of Array.from(document.querySelectorAll(".rs"))) expand(s);
})();
</script>
</body></html>
